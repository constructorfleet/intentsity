name: Release

# Chained off Tag Release rather than off the tag push: a push made with
# GITHUB_TOKEN never triggers another workflow, but `workflow_run` fires
# regardless of who authenticated the run that produced it.
on:
  workflow_run:
    workflows: ["Tag Release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    # A run that tagged nothing uploads no artifact, so the download step below
    # is what decides whether there is a release to cut.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the tag from the run that produced it
        id: tag
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-tag
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the tag
        id: read
        if: steps.tag.outcome == 'success'
        run: |
          TAG=$(cat release-tag.txt)
          if [ -z "${TAG}" ]; then
            echo "::error::release-tag artifact is empty"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # By tag, not by branch: main may already have moved on, and the release
      # must describe the commit that was tagged.
      - uses: actions/checkout@v4
        if: steps.read.outputs.tag != ''
        with:
          ref: ${{ steps.read.outputs.tag }}

      # HACS installs the version in manifest.json; the tag comes from
      # pyproject.toml. A mismatch ships a release nobody can install cleanly.
      - name: Cross-check the versions
        if: steps.read.outputs.tag != ''
        env:
          TAG: ${{ steps.read.outputs.tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["TAG"].removeprefix("v")
          versions = {
              "pyproject.toml": tomllib.loads(
                  Path("pyproject.toml").read_text()
              )["project"]["version"],
              "manifest.json": json.loads(
                  Path("custom_components/intentsity/manifest.json").read_text()
              )["version"],
              "frontend/package.json": json.loads(
                  Path("frontend/package.json").read_text()
              )["version"],
          }
          wrong = {name: v for name, v in versions.items() if v != expected}
          if wrong:
              raise SystemExit(f"Expected {expected} everywhere, found {wrong}")
          PY

      - uses: softprops/action-gh-release@v2
        if: steps.read.outputs.tag != ''
        with:
          tag_name: ${{ steps.read.outputs.tag }}
          generate_release_notes: true
