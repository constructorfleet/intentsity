<!-- @dsCard group="Wake Word Annotator" viewport="1280x780" name="Annotator — main view" subtitle="Clip queue, waveform review, label picker" -->
<!-- @startingPoint section="Screens" subtitle="Wake-word review workspace" viewport="1280x800" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Wake Word Annotator</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:var(--surface-app)}
#root{height:100vh}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Sidebar, SidebarSection, SidebarItem, Toolbar, ToolbarSeparator, ToolbarSpacer,
  Button, IconButton, Badge, LabelChip, WAKE_LABELS, Waveform, Card, Tabs, KeyValue,
  Input, Checkbox, Kbd, StatCell, Switch, Tooltip } = window.WaveformDesignSystem_606875;

// --- Icons ---
const Ico = ({d, size=14}) => <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">{d.split('|').map((p,i)=><path key={i} d={p}/>)}</svg>;
const PlayIcon = () => <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 2l7 4-7 4V2z"/></svg>;
const PauseIcon = () => <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="3" y="2" width="2" height="8"/><rect x="7" y="2" width="2" height="8"/></svg>;

// --- Fake data ---
const seedRand = (s) => { let x=s; return () => { x=(x*9301+49297)%233280; return x/233280; }; };
function makeClip(i, seed){
  const r = seedRand(seed+i);
  return {
    id:'c_' + (seed*7+i).toString(16).padStart(8,'0'),
    duration:(0.6 + r()*1.4).toFixed(2),
    confidence:(0.4 + r()*0.55).toFixed(2),
    device: ['kitchen_hub','bedroom_pixel','office_dot','car_mount'][Math.floor(r()*4)],
    time: `${Math.floor(r()*23)}:${String(Math.floor(r()*59)).padStart(2,'0')}`,
    seed: seed*13+i,
    label: null,
  };
}
const initialClips = Array.from({length:24}, (_,i) => makeClip(i, 42));

function Annotator(){
  const [clips, setClips] = React.useState(initialClips);
  const [selIdx, setSelIdx] = React.useState(0);
  const [playing, setPlaying] = React.useState(false);
  const [playhead, setPlayhead] = React.useState(0.32);
  const [tab, setTab] = React.useState('unlabeled');
  const [autoAdvance, setAutoAdvance] = React.useState(true);
  const [theme, setTheme] = React.useState('light');

  const clip = clips[selIdx];

  React.useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setPlayhead(p => p >= 1 ? (setPlaying(false), 0) : p + 0.01), 30);
    return () => clearInterval(id);
  }, [playing]);

  const setLabel = (labelId) => {
    setClips(cs => cs.map((c,i) => i===selIdx ? {...c, label:labelId} : c));
    if (autoAdvance) setTimeout(() => { setSelIdx(i => Math.min(clips.length-1, i+1)); setPlayhead(0); setPlaying(false); }, 100);
  };

  // Keyboard
  React.useEffect(() => {
    const h = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const num = ['1','2','3','4','5'].indexOf(e.key);
      if (num >= 0) { setLabel(WAKE_LABELS[num].id); return; }
      if (e.key === ' ') { e.preventDefault(); setPlaying(p=>!p); return; }
      if (e.key === 'j' || e.key === 'ArrowDown') setSelIdx(i=>Math.min(clips.length-1,i+1));
      if (e.key === 'k' || e.key === 'ArrowUp') setSelIdx(i=>Math.max(0,i-1));
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  });

  const counts = clips.reduce((a,c) => (c.label ? a.labeled++ : a.unlabeled++, a), {labeled:0, unlabeled:0, flagged:0});

  return (
    <div data-theme={theme} style={{display:'flex', height:'100vh', background:'var(--surface-app)', color:'var(--text-body)', fontFamily:'var(--font-sans)'}}>
      {/* LEFT SIDEBAR */}
      <Sidebar>
        <div style={{padding:'14px 12px', display:'flex', alignItems:'center', gap:8, borderBottom:'1px solid var(--border-subtle)'}}>
          <svg width="18" height="18" viewBox="0 0 24 24"><rect x="2" y="10" width="2" height="4" fill="var(--brand-500)"/><rect x="6" y="6" width="2" height="12" fill="var(--brand-500)"/><rect x="10" y="2" width="2" height="20" fill="var(--brand-400)"/><rect x="14" y="6" width="2" height="12" fill="var(--brand-400)"/><rect x="18" y="10" width="2" height="4" fill="var(--brand-300)"/></svg>
          <span style={{fontWeight:700, fontSize:14, letterSpacing:-0.02}}>Intentsity</span>
        </div>
        <SidebarSection title="Workspaces">
          <SidebarItem icon={<Ico d="M2 8h12M8 2v12"/>} active badge={counts.unlabeled}>Wake word</SidebarItem>
          <SidebarItem icon={<Ico d="M2 4h12M2 8h12M2 12h8"/>} badge={42}>Intent training</SidebarItem>
        </SidebarSection>
        <SidebarSection title="Datasets">
          <SidebarItem active>hey-atlas / prod</SidebarItem>
          <SidebarItem>hey-atlas / edge cases</SidebarItem>
          <SidebarItem>ok-atlas / prod</SidebarItem>
          <SidebarItem>alexa-baseline</SidebarItem>
        </SidebarSection>
        <SidebarSection title="Models">
          <SidebarItem icon={<Ico d="M8 2v12M2 8h12"/>}>wake-atlas-v3.2.1</SidebarItem>
          <SidebarItem>wake-atlas-v2.4.0</SidebarItem>
        </SidebarSection>
        <div style={{marginTop:'auto', padding:'10px 12px', borderTop:'1px solid var(--border-subtle)', display:'flex', alignItems:'center', gap:8, fontSize:12, color:'var(--text-muted)'}}>
          <div style={{width:26, height:26, borderRadius:'50%', background:'var(--brand-500)', color:'var(--text-on-brand)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:600}}>MJ</div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{color:'var(--text-body)', fontSize:12, fontWeight:500}}>maria.jansen</div>
            <div style={{fontSize:11}}>Voice ML team</div>
          </div>
          <Tooltip content="Toggle theme"><IconButton size="sm" aria-label="theme" onClick={()=>setTheme(t=>t==='light'?'dark':'light')}><Ico d="M8 2v2|M8 12v2|M2 8h2|M12 8h2" size={12}/></IconButton></Tooltip>
        </div>
      </Sidebar>

      {/* MAIN */}
      <div style={{flex:1, display:'flex', flexDirection:'column', minWidth:0}}>
        <Toolbar>
          <span style={{fontSize:12, color:'var(--text-muted)'}}>Datasets</span>
          <span style={{fontSize:12, color:'var(--text-subtle)'}}>/</span>
          <span style={{fontWeight:600, fontSize:14}}>hey-atlas / prod</span>
          <Badge tone="brand">128 new</Badge>
          <ToolbarSeparator/>
          <Input size="sm" placeholder="Filter by device, time, confidence…" style={{width:260}} prefix={<Ico d="M7 2a5 5 0 100 10 5 5 0 000-10zM11.5 11.5L14 14" size={12}/>}/>
          <ToolbarSpacer/>
          <Switch checked={autoAdvance} onChange={setAutoAdvance} label="Auto-advance"/>
          <ToolbarSeparator/>
          <Button size="sm" variant="ghost">Export</Button>
          <Button size="sm" variant="primary">Save labels ({counts.labeled})</Button>
        </Toolbar>

        <div style={{flex:1, display:'flex', minHeight:0}}>
          {/* CLIP LIST */}
          <div style={{width:320, minWidth:320, borderRight:'1px solid var(--border-subtle)', background:'var(--surface-panel)', display:'flex', flexDirection:'column'}}>
            <div style={{padding:'8px 12px', borderBottom:'1px solid var(--border-subtle)'}}>
              <Tabs value={tab} onChange={setTab} tabs={[
                {value:'unlabeled', label:'Unlabeled', count:counts.unlabeled},
                {value:'labeled', label:'Labeled', count:counts.labeled},
                {value:'flagged', label:'Flagged', count:8},
              ]}/>
            </div>
            <div style={{flex:1, overflow:'auto'}}>
              {clips.map((c,i) => {
                const active = i === selIdx;
                const tone = c.label ? WAKE_LABELS.find(l=>l.id===c.label)?.tone : null;
                const toneColor = tone ? `var(--${tone==='bgnoise'?'bg':tone}-500)` : 'transparent';
                return (
                  <button key={c.id} onClick={()=>{setSelIdx(i); setPlayhead(0);}}
                    style={{
                      display:'flex', alignItems:'center', gap:10, width:'100%',
                      padding:'10px 12px', border:'none', textAlign:'left',
                      background: active ? 'var(--accent-quiet)' : 'transparent',
                      borderLeft: active ? '2px solid var(--accent)' : '2px solid transparent',
                      borderBottom:'1px solid var(--border-subtle)',
                      cursor:'pointer', color:'var(--text-body)'
                    }}>
                    <div style={{width:3, alignSelf:'stretch', background:toneColor, borderRadius:2}}/>
                    <div style={{flex:1, minWidth:0}}>
                      <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:4}}>
                        <span style={{fontFamily:'var(--font-mono)', fontSize:12, color:'var(--text-body)', fontWeight:500}}>{c.id}</span>
                        {c.label && <Badge tone={c.label==='bgnoise'?'bgnoise':c.label} style={{height:16, padding:'0 6px', fontSize:9}}>{WAKE_LABELS.find(l=>l.id===c.label).short}</Badge>}
                      </div>
                      <div style={{display:'flex', gap:10, fontSize:11, color:'var(--text-muted)', fontFamily:'var(--font-mono)'}}>
                        <span>{c.duration}s</span>
                        <span>·</span>
                        <span>{c.device}</span>
                        <span>·</span>
                        <span>conf {c.confidence}</span>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* CLIP DETAIL */}
          <div style={{flex:1, padding:20, overflow:'auto', display:'flex', flexDirection:'column', gap:16, minWidth:0}}>
            <Card padded={false}>
              <div style={{padding:'14px 18px', borderBottom:'1px solid var(--border-subtle)', display:'flex', alignItems:'center', gap:12}}>
                <div style={{flex:1}}>
                  <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:4}}>
                    <span style={{fontFamily:'var(--font-mono)', fontSize:16, fontWeight:600}}>{clip.id}</span>
                    <Badge mono>{clip.duration}s</Badge>
                    <Badge tone="brand">conf {clip.confidence}</Badge>
                  </div>
                  <div style={{fontSize:12, color:'var(--text-muted)'}}>{clip.device} · captured today at {clip.time}</div>
                </div>
                <IconButton aria-label="Previous" onClick={()=>setSelIdx(i=>Math.max(0,i-1))}><Ico d="M10 3L5 8l5 5"/></IconButton>
                <IconButton aria-label="Next" onClick={()=>setSelIdx(i=>Math.min(clips.length-1,i+1))}><Ico d="M6 3l5 5-5 5"/></IconButton>
              </div>
              <div style={{padding:'22px 22px 14px'}}>
                <Waveform seed={clip.seed} samples={120} playhead={playhead} region={{start:.28, end:.44}} onScrub={setPlayhead} height={96}/>
                <div style={{display:'flex', alignItems:'center', gap:12, marginTop:14}}>
                  <IconButton variant="primary" size="lg" aria-label={playing?'Pause':'Play'} onClick={()=>setPlaying(p=>!p)}>
                    {playing ? <PauseIcon/> : <PlayIcon/>}
                  </IconButton>
                  <div style={{fontFamily:'var(--font-mono)', fontSize:13, color:'var(--text-muted)'}}>
                    {(playhead*parseFloat(clip.duration)).toFixed(2)}s / {clip.duration}s
                  </div>
                  <div style={{marginLeft:'auto', display:'flex', alignItems:'center', gap:6, fontSize:12, color:'var(--text-muted)'}}>
                    <Kbd>Space</Kbd> play<Kbd>J</Kbd>/<Kbd>K</Kbd> nav
                  </div>
                </div>
              </div>
              <div style={{padding:'16px 22px', borderTop:'1px solid var(--border-subtle)', background:'var(--surface-sunken)'}}>
                <div style={{fontSize:11, textTransform:'uppercase', letterSpacing:'var(--tracking-caps)', color:'var(--text-subtle)', fontWeight:600, marginBottom:10}}>Label this clip</div>
                <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
                  {WAKE_LABELS.map(l => (
                    <LabelChip key={l.id} tone={l.tone} shortcut={l.key}
                      selected={clip.label === l.id}
                      onClick={() => setLabel(l.id)}>{l.label}</LabelChip>
                  ))}
                </div>
              </div>
            </Card>

            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
              <Card title="Clip metadata" elevation="flat">
                <KeyValue items={[
                  {k:'Clip ID', v:clip.id, mono:true},
                  {k:'Duration', v:`${clip.duration}s`, mono:true},
                  {k:'Sample rate', v:'16 kHz', mono:true},
                  {k:'Device', v:clip.device},
                  {k:'Model version', v:'wake-atlas-v3.2.1', mono:true},
                  {k:'Confidence', v:clip.confidence, mono:true},
                ]}/>
              </Card>
              <Card title="Session progress">
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
                  <StatCell label="Labeled" value={counts.labeled} unit={`/ ${clips.length}`}/>
                  <StatCell label="Session accuracy" value="94.2%" delta="vs last: +1.1%" deltaTone="up"/>
                  <StatCell label="Median time" value="3.4s" unit="per clip"/>
                  <StatCell label="Flagged" value={counts.flagged} deltaTone="neutral"/>
                </div>
              </Card>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Annotator/>);

</script>
</body></html>
