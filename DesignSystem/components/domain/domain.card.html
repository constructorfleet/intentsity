<!-- @dsCard group="Components" viewport="700x400" name="Domain — Waveform, Turn, Tool, Stat, Kbd" subtitle="The five voice-training-specific primitives" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface-app);font-family:var(--font-sans)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.panel{background:var(--surface-panel); border:1px solid var(--border-subtle); border-radius:8px; padding:14px}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Waveform, ConversationTurn, ToolInvocation, StatCell, Kbd } = window.WaveformDesignSystem_606875;
function App(){
  const [ph,setPh]=React.useState(0.38);
  return <div className="grid">
    <div className="panel" style={{gridColumn:'1 / -1'}}>
      <div className="lbl">Waveform — with region + playhead + scrub</div>
      <Waveform seed={7} samples={90} playhead={ph} region={{start:.28, end:.44}} onScrub={setPh} height={72}/>
    </div>
    <div className="panel">
      <div className="lbl">ConversationTurn</div>
      <div style={{display:'flex', flexDirection:'column', gap:8}}>
        <ConversationTurn role="user" timestamp="0.4s">turn on the kitchen lights</ConversationTurn>
        <ConversationTurn role="assistant">Turning on the kitchen lights.</ConversationTurn>
      </div>
    </div>
    <div className="panel">
      <div className="lbl">ToolInvocation</div>
      <ToolInvocation name="lights.set" status="ok" args={{room:'kitchen', on:true, brightness:80}} result={{ok:true, applied_at:'0.9s'}}/>
    </div>
    <div className="panel">
      <div className="lbl">StatCell</div>
      <div style={{display:'flex', gap:24}}>
        <StatCell label="Precision" value="0.982" delta="+0.014" deltaTone="up"/>
        <StatCell label="Recall" value="0.941" delta="−0.006" deltaTone="down"/>
        <StatCell label="Clips" value="12,410" unit="labeled"/>
      </div>
    </div>
    <div className="panel">
      <div className="lbl">Kbd — shortcut hints</div>
      <div style={{fontSize:13, color:'var(--text-muted)', lineHeight:1.7}}>
        Press <Kbd>1</Kbd>–<Kbd>5</Kbd> to label. <Kbd>Space</Kbd> to play, <Kbd>J</Kbd>/<Kbd>K</Kbd> to move, <Kbd>⌘S</Kbd> to save.
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
