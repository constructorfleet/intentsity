<!-- @dsCard group="Components" viewport="700x180" name="Selection Controls" subtitle="Checkbox · Radio · Switch" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--surface-panel);font-family:var(--font-sans)}
.grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:block}
.stack{display:flex; flex-direction:column; gap:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Checkbox, Radio, RadioGroup, Switch } = window.WaveformDesignSystem_606875;
function App(){
  const [c1,setC1]=React.useState(true); const [c2,setC2]=React.useState(false);
  const [r,setR]=React.useState('tp');
  const [s1,setS1]=React.useState(true); const [s2,setS2]=React.useState(false);
  return <div className="grid">
  <div><span className="lbl">Checkbox</span><div className="stack">
    <Checkbox checked={c1} onChange={setC1} label="Include background noise" id="cb1"/>
    <Checkbox checked={c2} onChange={setC2} label="Only unlabeled clips" id="cb2"/>
    <Checkbox indeterminate label="All datasets (12/28)" id="cb3"/>
  </div></div>
  <div><span className="lbl">Radio</span><RadioGroup>
    <Radio name="lbl" checked={r==='tp'} onChange={()=>setR('tp')} label="True positive" id="r1"/>
    <Radio name="lbl" checked={r==='fp'} onChange={()=>setR('fp')} label="False positive" id="r2"/>
    <Radio name="lbl" checked={r==='bg'} onChange={()=>setR('bg')} label="Background noise" id="r3"/>
  </RadioGroup></div>
  <div><span className="lbl">Switch</span><div className="stack">
    <Switch checked={s1} onChange={setS1} label="Auto-advance after label"/>
    <Switch checked={s2} onChange={setS2} label="Show waveform grid"/>
    <Switch disabled label="Deploy on save"/>
  </div></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
