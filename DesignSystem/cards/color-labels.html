<!-- @dsCard group="Colors" viewport="700x180" name="Annotation Labels" subtitle="Semantic palette matches the 5 wake-word classes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-panel);color:var(--text-body);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid; grid-template-columns:repeat(5,1fr); gap:10px">

<div style="border:1px solid var(--border-subtle); border-radius:6px; overflow:hidden">
  <div style="height:44px; background:var(--tp-500); display:flex; align-items:flex-end; padding:4px 8px; color:#fff; font-family:var(--font-mono); font-size:11px; font-weight:600">TP</div>
  <div style="height:24px; background:var(--tp-050)"></div>
  <div style="padding:6px 8px; font-size:11px; color:var(--text-muted)">True positive</div>
</div>
<div style="border:1px solid var(--border-subtle); border-radius:6px; overflow:hidden">
  <div style="height:44px; background:var(--tn-500); display:flex; align-items:flex-end; padding:4px 8px; color:#fff; font-family:var(--font-mono); font-size:11px; font-weight:600">TN</div>
  <div style="height:24px; background:var(--tn-050)"></div>
  <div style="padding:6px 8px; font-size:11px; color:var(--text-muted)">True negative</div>
</div>
<div style="border:1px solid var(--border-subtle); border-radius:6px; overflow:hidden">
  <div style="height:44px; background:var(--fp-500); display:flex; align-items:flex-end; padding:4px 8px; color:#fff; font-family:var(--font-mono); font-size:11px; font-weight:600">FP</div>
  <div style="height:24px; background:var(--fp-050)"></div>
  <div style="padding:6px 8px; font-size:11px; color:var(--text-muted)">False positive</div>
</div>
<div style="border:1px solid var(--border-subtle); border-radius:6px; overflow:hidden">
  <div style="height:44px; background:var(--fn-500); display:flex; align-items:flex-end; padding:4px 8px; color:#fff; font-family:var(--font-mono); font-size:11px; font-weight:600">FN</div>
  <div style="height:24px; background:var(--fn-050)"></div>
  <div style="padding:6px 8px; font-size:11px; color:var(--text-muted)">False negative</div>
</div>
<div style="border:1px solid var(--border-subtle); border-radius:6px; overflow:hidden">
  <div style="height:44px; background:var(--bg-500); display:flex; align-items:flex-end; padding:4px 8px; color:#fff; font-family:var(--font-mono); font-size:11px; font-weight:600">BG</div>
  <div style="height:24px; background:var(--bg-050)"></div>
  <div style="padding:6px 8px; font-size:11px; color:var(--text-muted)">Background noise</div>
</div>
</div></body></html>
