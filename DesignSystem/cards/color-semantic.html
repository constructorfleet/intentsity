<!-- @dsCard group="Colors" viewport="700x210" name="Semantic Surfaces" subtitle="Backgrounds, borders, and text roles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-panel);color:var(--text-body);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; font-size:12px; font-family:var(--font-mono)">
<div style="border:1px solid var(--border-default); border-radius:6px; padding:10px; background:var(--surface-app); color:var(--text-body)">
  <div style="font-weight:600">--surface-app</div>
  <div style="color:var(--text-muted); font-family:var(--font-sans); font-size:11px; margin-top:2px">app background</div>
</div><div style="border:1px solid var(--border-default); border-radius:6px; padding:10px; background:var(--surface-panel); color:var(--text-body)">
  <div style="font-weight:600">--surface-panel</div>
  <div style="color:var(--text-muted); font-family:var(--font-sans); font-size:11px; margin-top:2px">panel</div>
</div><div style="border:1px solid var(--border-default); border-radius:6px; padding:10px; background:var(--surface-sunken); color:var(--text-body)">
  <div style="font-weight:600">--surface-sunken</div>
  <div style="color:var(--text-muted); font-family:var(--font-sans); font-size:11px; margin-top:2px">sunken</div>
</div><div style="border:1px solid var(--border-default); border-radius:6px; padding:10px; background:var(--surface-hover); color:var(--text-body)">
  <div style="font-weight:600">--surface-hover</div>
  <div style="color:var(--text-muted); font-family:var(--font-sans); font-size:11px; margin-top:2px">hover</div>
</div><div style="border:1px solid var(--border-default); border-radius:6px; padding:10px; background:var(--surface-active); color:var(--text-body)">
  <div style="font-weight:600">--surface-active</div>
  <div style="color:var(--text-muted); font-family:var(--font-sans); font-size:11px; margin-top:2px">active</div>
</div><div style="border:1px solid var(--border-default); border-radius:6px; padding:10px; background:var(--surface-inverse); color:var(--text-inverse)">
  <div style="font-weight:600">--surface-inverse</div>
  <div style="color:var(--text-muted); font-family:var(--font-sans); font-size:11px; margin-top:2px">inverse</div>
</div>
</div></body></html>
