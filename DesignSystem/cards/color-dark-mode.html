<!-- @dsCard group="Colors" viewport="700x150" name="Dark Mode Preview" subtitle="Panel, sunken, borders under [data-theme=dark]" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-panel);color:var(--text-body);font-family:var(--font-sans)}</style>
</head><body>
<div data-theme="dark" style="background:var(--surface-app); padding:16px; border-radius:8px; display:flex; gap:10px; align-items:stretch; color:var(--text-body); font-family:var(--font-sans)">
  <div style="flex:1; background:var(--surface-panel); border:1px solid var(--border-subtle); border-radius:6px; padding:10px">
    <div style="font-size:11px; color:var(--text-subtle); text-transform:uppercase; letter-spacing:.08em">Panel</div>
    <div style="margin-top:6px; font-size:13px">hey-atlas / prod</div>
    <div style="margin-top:8px; display:inline-block; padding:2px 8px; background:var(--accent-quiet); color:var(--accent); border-radius:999px; font-size:11px; font-weight:600">128 new</div>
  </div>
  <div style="flex:1; background:var(--surface-sunken); border:1px solid var(--border-subtle); border-radius:6px; padding:10px; font-family:var(--font-mono); font-size:12px; color:var(--text-muted)">$ waveform label --auto</div>
</div></body></html>
