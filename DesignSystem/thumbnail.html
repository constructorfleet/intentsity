<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="./styles.css">
<style>html,body{margin:0;height:100%;background:#000}
.page{display:flex; width:1280px; height:854px}
.main{flex:1; background:var(--brand-500); display:flex; align-items:center; justify-content:center; gap:32px}
.mark{display:flex; gap:14px; align-items:flex-end}
.bar{width:22px; background:#00131a; border-radius:3px}
.name{font-family:var(--font-sans); font-size:180px; font-weight:700; color:#00131a; letter-spacing:-0.03em; line-height:1}
.strip{width:200px; display:flex; flex-direction:column}
.sw{flex:1}
</style></head><body>
<div class="page">
  <div class="main">
    <div class="mark">
      <div class="bar" style="height:80px"></div>
      <div class="bar" style="height:200px"></div>
      <div class="bar" style="height:340px"></div>
      <div class="bar" style="height:200px"></div>
      <div class="bar" style="height:80px"></div>
    </div>
    <div class="name">Intentsity</div>
  </div>
  <div class="strip">
    <div class="sw" style="background:#48d7c4"></div>
    <div class="sw" style="background:#f59e0b"></div>
    <div class="sw" style="background:#ef4444"></div>
    <div class="sw" style="background:#8b5cf6"></div>
  </div>
</div>
</body></html>
